name: conectalab
description: 'Laboratorio educativo de redes móviles.'
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  # Conserva los iconos nativos que Flutter usa en transiciones de iOS.
  cupertino_icons: ^1.0.8
  connectivity_plus: 7.3.1
  http: ^1.6.0
  flutter_blue_plus: 2.3.14
  permission_handler: 12.0.1
  image_picker: 1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
